<!-- Layout general con sidebar y banner -->
<div class="flex flex-col min-h-screen">
  <!-- Overlay para móviles -->
  <div class="fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity duration-300 md:hidden"
    *ngIf="sidebarAbierto" (click)="toggleSidebar()"></div>

  <!-- Banner superior institucional con logo, botón de menú y cerrar sesión -->
  <div class="bg-white shadow px-6 py-4 flex items-center justify-between relative transition-all duration-300"
    [ngClass]="{ 'md:ml-64': sidebarAbierto }">
    <div class="flex items-center gap-4">
      <button class="bg-white text-gray-700 p-2 rounded-md shadow-md z-50" (click)="toggleSidebar()">
        <i class="fa-solid" [ngClass]="sidebarAbierto ? 'fa-xmark' : 'fa-bars'"></i>
      </button>
      <img src="assets/logo_cootep.png" alt="Logo Cootep" class="h-10" />
    </div>
    <app-menu-usuario [nombres]="usuario?.nombres" [apellidos]="usuario?.apellidos"
      (cerrarSesion)="cerrarSesion()"></app-menu-usuario>

  </div>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <app-sidebar [items]="menuItems" [abierto]="sidebarAbierto"></app-sidebar>


    <!-- Contenido principal -->
    <div class="flex-1 ml-0 overflow-y-auto transition-all duration-300" [ngClass]="{ 'md:ml-64': sidebarAbierto }">
      <!-- Banner de bienvenida con ancho limitado -->
      <div class="bg-cyan-600 text-white px-6 py-4 text-center font-semibold max-w-5xl mx-auto rounded-md mt-6">
        Bienvenido(a) {{ usuario?.nombres | uppercase }}
        {{ usuario?.apellidos | uppercase }}. Verifique que toda su información
        de datos básicos y ubicación estén actualizados
      </div>

      <!-- Sección de información personal -->
      <div class="max-w-6xl mx-auto px-6 py-10">
        <div class="bg-white border rounded-xl shadow-md p-6">
          <h2 class="text-xl font-bold text-white bg-blue-900 px-4 py-2 rounded-t-md">
            Mis Datos
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-4">
            <app-dato-usuario label="Nombres" [value]="usuario?.nombres"></app-dato-usuario>
            <app-dato-usuario label="Apellidos" [value]="usuario?.apellidos"></app-dato-usuario>
            <app-dato-usuario label="Correo" [value]="usuario?.correo"></app-dato-usuario>
            <app-dato-usuario label="Fecha de Nacimiento" [value]="usuario?.fecha_nacimiento"></app-dato-usuario>
            <app-dato-usuario label="Fecha de Ingreso" [value]="usuario?.fecha_ingreso"></app-dato-usuario>
            <app-dato-usuario label="Género" [value]="usuario?.genero?.nombre"></app-dato-usuario>
            <app-dato-usuario label="Municipio de Nacimiento"
              [value]="usuario?.municipioNacimiento?.nombre"></app-dato-usuario>
            <app-dato-usuario label="Lugar de Expedición" [value]="usuario?.lugarExpedicion?.nombre"></app-dato-usuario>
            <app-dato-usuario label="Cargo" [value]="usuario?.cargo?.nombre"></app-dato-usuario>
            <app-dato-usuario label="Tipo de Contrato" [value]="usuario?.tipoContrato?.nombre"></app-dato-usuario>
          </div>
        </div>

        <!-- Botón de certificado -->
        <div class="flex justify-center mt-10">
          <button (click)="generarCertificado()"
            class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md transition-all duration-300">
            <i class="fa-solid fa-file-pdf mr-2"></i>
            Descargar Certificado Laboral
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <app-footer [sidebarAbierto]="sidebarAbierto"></app-footer>

</div>
