<div class="max-w-5xl mx-auto bg-white p-8 rounded shadow-md mt-6">
  <h2 class="text-2xl font-bold text-center mb-8">Información Personal</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="grid grid-cols-1 md:grid-cols-3 gap-6">
    
    <!-- Nombres -->
    <div>
      <label class="block mb-1 font-medium">Nombres</label>
      <input formControlName="nombres" type="text"
        class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Ej. Juan">
    </div>

    <!-- Apellidos -->
    <div>
      <label class="block mb-1 font-medium">Apellidos</label>
      <input formControlName="apellidos" type="text"
        class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Ej. Pérez">
    </div>

    <!-- Fecha de Nacimiento -->
    <div>
      <label class="block mb-1 font-medium">Fecha de nacimiento</label>
      <input formControlName="fecha_nacimiento" type="date"
        class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Lugar de Expedición -->
    <div>
      <label class="block mb-1 font-medium">Lugar de expedición (ID)</label>
      <input formControlName="lugarExpedicion.id" type="number"
        class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Municipio de Nacimiento -->
    <div>
      <label class="block mb-1 font-medium">Municipio de nacimiento (ID)</label>
      <input formControlName="municipioNacimiento.id" type="number"
        class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Género -->
    <div>
      <label class="block mb-1 font-medium">Género (ID)</label>
      <input formControlName="genero.id" type="number"
        class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Botón de guardar -->
    <div class="md:col-span-3 text-right mt-4">
      <button type="submit"
        class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition-all duration-200">
        Guardar Cambios
      </button>
    </div>
  </form>
</div>
