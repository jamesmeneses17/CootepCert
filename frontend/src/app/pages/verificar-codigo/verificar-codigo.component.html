<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-6 rounded-xl shadow w-full max-w-md text-center">
    <h2 class="text-xl font-semibold text-green-700 mb-4">Ingresa el código</h2>
    <p class="text-sm text-gray-500 mb-4">
      Revisa tu correo, te hemos enviado un código de 6 dígitos
    </p>

    <input
      [(ngModel)]="codigo"
      maxlength="6"
      placeholder="••••••"
      class="w-full text-center text-2xl tracking-widest border px-4 py-2 rounded-md mb-4"
    />

    <button
      (click)="verificarCodigo()"
      class="w-full bg-green-600 text-white py-2 rounded-lg mb-2"
    >
      Verificar Código
    </button>

    <button
      (click)="reenviarCodigo()"
      [disabled]="contador > 0"
      class="text-sm text-blue-600 underline disabled:text-gray-400"
    >
      Reenviar código
    </button>

    <!-- Mostrar cuenta regresiva -->
    <div *ngIf="contador > 0" class="text-xs text-gray-500 mt-1">
      Puedes reenviar en {{ contador }} segundos...
    </div>
  </div>
</div>
