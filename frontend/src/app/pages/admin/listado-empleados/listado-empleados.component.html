<h2>Listado de Empleados</h2>

<input
  type="text"
  [(ngModel)]="filtro"
  placeholder="Buscar por cédula o nombre"
  class="border px-4 py-2 mb-4 w-full"
/>

<table class="w-full border">
  <thead>
    <tr>
      <th>Nombres</th>
      <th>Apellidos</th>
      <th>Cédula</th>
      <th>Cargo</th>
      <th>Fecha de Ingreso</th>
      <th>Acciones</th> <!-- ✅ Nueva columna -->
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let empleado of empleadosFiltrados">
      <td>{{ empleado.nombres }}</td>
      <td>{{ empleado.apellidos }}</td>
      <td>{{ empleado.correo }}</td>
      <td>{{ empleado.cedula }}</td>
      <td>{{ empleado.cargo?.nombre }}</td>
      <td>{{ empleado.fecha_ingreso }}</td>
      <td>
        <a
          [routerLink]="['/admin/empleados/editar', empleado.id]"
          class="text-white bg-yellow-500 px-3 py-1 rounded inline-block hover:bg-yellow-600"
        >
          ✏️
        </a>
      </td>
    </tr>
  </tbody>
</table>
